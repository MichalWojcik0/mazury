<!-- Bottom Controls, Quick Inventory, and Actions -->
<div class="bottom-bar">
  <div class="controls-panel ui-interactive">
    <div class="dpad-container">
      <div></div>
      <button class="ui-btn" id="btn-up" title="Move North (W / Up)">▲</button>
      <div></div>
      <button class="ui-btn" id="btn-left" title="Move West (A / Left)">◀</button>
      <button class="ui-btn" id="btn-center" disabled style="opacity: 0.3;">●</button>
      <button class="ui-btn" id="btn-right" title="Move East (D / Right)">▶</button>
      <div></div>
      <button class="ui-btn" id="btn-down" title="Move South (S / Down)">▼</button>
      <div></div>
    </div>
    <button class="ui-btn squat-btn" id="btn-squat" title="Hold Shift or click to toggle Squat (4x crop growth + poop)">
      🧎 Squat [Shift]
    </button>
    <button class="ui-btn eat-btn" id="btn-eat" title="Eat equipped food (F or Right-Click)" style="display: none;">
      🍽 Eat [F]
    </button>
  </div>

  <!-- Inventory Container -->
  <div class="inventory-section ui-interactive">
    <!-- Full 36-slot Drawer -->
    <div class="full-inventory-drawer" id="full-inv-drawer">
      <div class="drawer-title-row">
        <span>Inventory (36 Slots)</span>
        <button class="inv-toggle-btn" id="btn-close-full-inv">✕ Close</button>
      </div>
      <div class="inventory-grid-36" id="grid-36-slots">
        <!-- Dynamically rendered 36 slots -->
      </div>
    </div>

    <!-- Crafting List Modal / Panel -->
    <div class="crafting-panel" id="crafting-panel">
      <div class="drawer-title-row">
        <div class="crafting-header-left">
          <span>List Crafting</span>
          <span class="station-status-badge" id="crafting-station-status">✋ Hand Only</span>
        </div>
        <div class="crafting-header-actions">
          <button class="inv-toggle-btn" id="btn-toggle-dual-crafting" title="View two independent crafting lists side by side">⇄ 2 Lists</button>
          <button class="inv-toggle-btn" id="btn-close-crafting">✕ Close</button>
        </div>
      </div>
      <div class="crafting-panes" id="crafting-panes">
        <div class="crafting-pane" id="crafting-pane-0">
          <div class="crafting-pane-controls">
            <select class="craft-select" id="craft-filter-0" title="Filter recipes">
              <option value="all">All Recipes</option>
              <option value="craftable">Craftable Only</option>
              <option value="hand">Hand Crafting</option>
              <option value="station">Crafting Station</option>
              <option value="basic">Basic &amp; Materials</option>
              <option value="tools">Tools</option>
              <option value="machinery">Machinery</option>
              <option value="fluid">Fluids</option>
              <option value="hidden">Hidden</option>
            </select>
            <select class="craft-select" id="craft-group-0" title="Group recipes">
              <option value="category">Group: Category</option>
              <option value="station">Group: Station</option>
              <option value="craftable">Group: Craftable</option>
              <option value="none">No Grouping</option>
            </select>
            <select class="craft-select" id="craft-sort-0" title="Sort recipes">
              <option value="craftable">Sort: Craftable</option>
              <option value="name">Sort: Name</option>
              <option value="category">Sort: Category</option>
            </select>
          </div>
          <div class="crafting-recipe-list" id="crafting-recipe-list-0">
            <!-- Dynamically rendered list recipes -->
          </div>
        </div>
        <div class="crafting-pane crafting-pane-secondary" id="crafting-pane-1">
          <div class="crafting-pane-controls">
            <select class="craft-select" id="craft-filter-1" title="Filter recipes (List 2)">
              <option value="all">All Recipes</option>
              <option value="craftable">Craftable Only</option>
              <option value="hand">Hand Crafting</option>
              <option value="station" selected>Crafting Station</option>
              <option value="basic">Basic &amp; Materials</option>
              <option value="tools">Tools</option>
              <option value="machinery">Machinery</option>
              <option value="fluid">Fluids</option>
              <option value="hidden">Hidden</option>
            </select>
            <select class="craft-select" id="craft-group-1" title="Group recipes (List 2)">
              <option value="category">Group: Category</option>
              <option value="station">Group: Station</option>
              <option value="craftable">Group: Craftable</option>
              <option value="none">No Grouping</option>
            </select>
            <select class="craft-select" id="craft-sort-1" title="Sort recipes (List 2)">
              <option value="craftable">Sort: Craftable</option>
              <option value="name">Sort: Name</option>
              <option value="category">Sort: Category</option>
            </select>
          </div>
          <div class="crafting-recipe-list" id="crafting-recipe-list-1">
            <!-- Dynamically rendered list recipes (List 2) -->
          </div>
        </div>
      </div>
    </div>

    <div class="inventory-header">
      <span class="widget-title" style="text-align: left; margin: 0;">Quick Use (Top 9 Slots)</span>
      <div style="display: flex; gap: 6px;">
        <button class="inv-toggle-btn" id="btn-toggle-crafting">🔨 Crafting [C]</button>
        <button class="inv-toggle-btn" id="btn-toggle-inv">📦 Full Inventory [E]</button>
      </div>
    </div>

    <!-- Top 9 Quick Selection / Hotbar -->
    <div class="quick-inventory-panel" id="hud-quick-inventory">
      <!-- Dynamically rendered top 9 slots -->
    </div>
  </div>

  <div class="psd-action-panel ui-interactive">
    <button class="psd-btn" id="btn-use-psd">
      ⚡ Use Personal Shrinking Device (P / Space)
    </button>
    <div class="hud-card legend-card">
      Walk: <span class="key-badge">WASD</span> &bull;
      Squat: <span class="key-badge">Shift</span> &bull;
      Eat: <span class="key-badge">F</span> &bull;
      Layer: <span class="key-badge">F1-F4</span> / <span class="key-badge">[ ]</span> &bull;
      Target: <span class="key-badge">Numpad 1-9</span> &bull;
      Inv: <span class="key-badge">E</span> / <span class="key-badge">1-9</span>
    </div>
  </div>
</div>
