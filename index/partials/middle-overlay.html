<!-- Middle Side Floating Widgets -->
<div class="middle-overlay">
  <!-- Play Area Zoom Controls -->
  <div class="zoom-controls-card ui-interactive" aria-label="Play area zoom controls">
    <div class="widget-title">Zoom</div>
    <button class="zoom-btn" id="btn-zoom-in" title="Zoom In (+)">+</button>
    <button class="zoom-reset-btn" id="btn-zoom-reset" title="Reset Zoom &amp; Pan (0)">100%</button>
    <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out (-)">−</button>
  </div>

  <!-- Target Layer + 3x3 Auxiliary Reticle + Target Voxel Action Card -->
  <div class="reticle-action-container">
    <div class="targeting-row">
      <!-- 4-Layer Selection Widget (next to Target Reticle) -->
      <div class="layer-selector-card ui-interactive">
        <div class="widget-title">Target Layer</div>
        <button class="layer-btn" data-layer="3" id="layer-btn-3">
          <span>3: Ceiling</span>
          <span class="hotkey">[F4]</span>
        </button>
        <button class="layer-btn" data-layer="2" id="layer-btn-2">
          <span>2: Head</span>
          <span class="hotkey">[F3]</span>
        </button>
        <button class="layer-btn active" data-layer="1" id="layer-btn-1">
          <span>1: Feet</span>
          <span class="hotkey">[F2]</span>
        </button>
        <button class="layer-btn" data-layer="0" id="layer-btn-0">
          <span>0: Floor</span>
          <span class="hotkey">[F1]</span>
        </button>
      </div>

      <div class="aux-reticle-card ui-interactive">
        <div class="widget-title">Target Reticle</div>
        <div class="reticle-grid">
          <button class="reticle-cell" data-slot="7" title="North-West (Numpad 7)">7</button>
          <button class="reticle-cell" data-slot="8" title="North (Numpad 8)">8</button>
          <button class="reticle-cell" data-slot="9" title="North-East (Numpad 9)">9</button>
          <button class="reticle-cell" data-slot="4" title="West (Numpad 4)">4</button>
          <button class="reticle-cell player-cell" data-slot="5" id="reticle-slot-5" title="Center (Numpad 5)">●</button>
          <button class="reticle-cell" data-slot="6" title="East (Numpad 6)">6</button>
          <button class="reticle-cell" data-slot="1" title="South-West (Numpad 1)">1</button>
          <button class="reticle-cell" data-slot="2" title="South (Numpad 2)">2</button>
          <button class="reticle-cell" data-slot="3" title="South-East (Numpad 3)">3</button>
        </div>
      </div>
    </div>

    <!-- UI Component to perform actions on the selected voxel -->
    <div class="voxel-action-card ui-interactive" id="voxel-action-card">
      <div class="voxel-target-header">
        <div class="voxel-target-title">Selected Voxel</div>
        <div class="voxel-target-name" id="voxel-target-name">None Selected</div>
        <div class="voxel-target-coords" id="voxel-target-coords">Coord: -</div>
      </div>
      <div class="voxel-action-list" id="voxel-action-list">
        <span class="voxel-no-action">Select a block to act</span>
      </div>
    </div>
  </div>
</div>
